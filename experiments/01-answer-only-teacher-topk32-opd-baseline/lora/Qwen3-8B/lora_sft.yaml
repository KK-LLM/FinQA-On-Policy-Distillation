### model
model_name_or_path: /root/model/Qwen3-8B

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128

# The container must have flash-attn installed; otherwise training falls back to SDPA.
flash_attn: fa2

### dataset
dataset_dir: /root/lora_config
dataset: finqa_lora_train
eval_dataset: finqa_lora_valid
template: qwen3_nothink
cutoff_len: 3072
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 8

### output
output_dir: /root/train_output/Qwen3-8B-LoRA-nothink
logging_steps: 5
save_strategy: steps
save_steps: 50
save_total_limit: 20
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
gradient_checkpointing: true
learning_rate: 3.0e-5
num_train_epochs: 8
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true
ddp_timeout: 180000000

### eval
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 100
compute_accuracy: true

# save_steps (50) is not an integer multiple of eval_steps (200), so automatic
# best-model reloading must stay disabled. Select best_model_checkpoint manually
# from trainer_state.json for merging.
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false
